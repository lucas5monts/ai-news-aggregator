services:
  - type: web
    name: ai-news-aggregator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_conf.py run:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString

databases:
  - name: ai-news-db
    plan: free
    databaseName: ainews
