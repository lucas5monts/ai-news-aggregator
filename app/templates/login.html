{% extends "base.html" %}
{% block title %}Sign in — AI News Dashboard{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
    <h1 class="text-2xl font-bold mb-2">Sign in</h1>
    <p class="text-sm text-gray-500 mb-6">
      Enter your email and we'll send you a magic sign-in link.
      No password needed.
    </p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email address
        </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autofocus
          placeholder="you@example.com"
          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium
               py-2 px-4 rounded-md text-sm transition-colors">
        Send sign-in link
      </button>
    </form>
  </div>
</div>
{% endblock %}
