{# HTMX swap target: bookmark toggle button #}
<button
  hx-post="{{ url_for('bookmarks.toggle_bookmark', story_id=story_id) }}"
  hx-swap="outerHTML"
  hx-target="this"
  title="{% if bookmarked %}Remove bookmark{% else %}Save for later{% endif %}"
  class="shrink-0 w-7 h-7 flex items-center justify-center rounded-lg transition-colors
         {% if bookmarked %}text-indigo-500 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10
         {% else %}text-zinc-400 dark:text-zinc-500 hover:text-indigo-500 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10{% endif %}">
  <i data-lucide="{% if bookmarked %}bookmark-check{% else %}bookmark{% endif %}" class="w-4 h-4"></i>
</button>
