{% if saved %}
<div class="mb-4 px-4 py-3 rounded-md bg-green-50 text-green-700 border border-green-200 text-sm">
  ✅ Settings saved.
</div>
{% endif %}

<form
  hx-post="{{ url_for('main.settings_post') }}"
  hx-target="#settings-form"
  hx-swap="innerHTML"
  class="space-y-8">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <!-- Digest preferences -->
  <section class="bg-white rounded-xl border border-gray-200 p-5">
    <h2 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Digest preferences</h2>
    <div class="space-y-3">

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" name="send_email"
               {% if user_settings.send_email %}checked{% endif %}
               class="h-4 w-4 rounded border-gray-300 text-blue-600">
        <span class="text-sm font-medium">Enable email delivery</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" name="morning_enabled"
               {% if user_settings.morning_enabled %}checked{% endif %}
               class="h-4 w-4 rounded border-gray-300 text-blue-600">
        <span class="text-sm font-medium">Morning digest (6:00 AM)</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" name="evening_enabled"
               {% if user_settings.evening_enabled %}checked{% endif %}
               class="h-4 w-4 rounded border-gray-300 text-blue-600">
        <span class="text-sm font-medium">Evening digest (8:00 PM)</span>
      </label>

      <div class="flex items-center gap-3">
        <label for="max_stories" class="text-sm font-medium whitespace-nowrap">Max stories</label>
        <input type="number" id="max_stories" name="max_stories" min="1" max="50"
               value="{{ user_settings.max_stories }}"
               class="w-20 px-2 py-1 border border-gray-300 rounded-md text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex items-center gap-3">
        <label for="timezone" class="text-sm font-medium whitespace-nowrap">Timezone</label>
        <input type="text" id="timezone" name="timezone"
               value="{{ user_settings.timezone }}"
               placeholder="America/Los_Angeles"
               class="flex-1 px-2 py-1 border border-gray-300 rounded-md text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="text-xs text-gray-400">IANA tz name</span>
      </div>

    </div>
  </section>

  <!-- Sources -->
  <section class="bg-white rounded-xl border border-gray-200 p-5">
    <h2 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Sources</h2>
    <div class="space-y-2">
      {% for src in all_sources %}
      <label class="flex items-center gap-3 cursor-pointer py-1">
        <input type="checkbox" name="source_{{ src.name }}"
               {% if user_source_map.get(src.name, src.get('enabled', True)) %}checked{% endif %}
               class="h-4 w-4 rounded border-gray-300 text-blue-600">
        <div>
          <span class="text-sm font-medium">{{ src.name }}</span>
          <span class="ml-2 text-xs text-gray-400 capitalize">{{ src.category }}</span>
          <span class="ml-1 text-xs text-gray-300">weight {{ src.weight }}</span>
        </div>
      </label>
      {% endfor %}
    </div>
  </section>

  <button type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium
                 py-2 px-5 rounded-md text-sm transition-colors">
    Save settings
  </button>

</form>
