# RSS feed sources for the general news aggregator.
#
# Stories are personalized per-user by an LLM against each subscriber's
# interest topics (see core/relevance.py). The public feed shows everything
# ranked by recency + source weight.
#
# Each source has:
#   name:     short display label (shown in the digest)
#   url:      RSS/Atom feed URL
#   category: one of [world, us, tech, ai, business, science, politics, sports]
#   weight:   ranking multiplier (1.0 = normal, >1 = boost, <1 = de-prioritize)
#   enabled:  toggle on/off without deleting the entry

sources:
  # ----- World -----
  - name: Reuters World
    url: https://www.reutersagency.com/feed/?best-topics=world&post_type=best
    category: world
    weight: 1.3
    enabled: true

  - name: AP News
    url: https://apnews.com/apf-topnews
    category: world
    weight: 1.3
    enabled: true

  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    category: world
    weight: 1.2
    enabled: true

  - name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    category: world
    weight: 1.0
    enabled: true

