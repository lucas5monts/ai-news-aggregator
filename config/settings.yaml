# Runtime settings for the news aggregator.

# Maximum stories to include in any single digest
max_stories: 20

# Only include stories published within the last N hours
# (morning edition = 24h, evening = ~12h, set by the scheduler)
default_time_window_hours: 24

# LLM personalization. Each subscriber's digest is scored against their
# interest topics (see core/relevance.py). The public feed is unfiltered.
llm:
  relevance_threshold: 0.4     # drop stories scored below this (0.0-1.0)
  max_stories_to_score: 50     # cap sent to the LLM per call (token control)
  fallback_to_all: true        # if the LLM fails, show all stories rather than none

# Digest format
digest:
  show_source: true
  show_published_relative: true   # "2h ago" instead of timestamp
  max_summary_chars: 280
  group_by_category: true
  category_order:
    - world
    - us
    - tech
    - ai
    - business
    - science
    - politics
    - sports
